name: aula
description: "Aula - Tu vida académica organizada, offline y elegante."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Local Persistence
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5

  # Security & Biometrics
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Media & Files
  image_picker: ^1.1.2
  image: ^4.5.4

  # Local Notifications & Timezone
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0

  # Backup, Export & Cryptography
  archive: ^4.0.2
  file_picker: ^10.1.0
  share_plus: ^10.1.4
  cryptography: ^2.7.2

  # Animations, Gestures & Charts
  flutter_animate: ^4.5.2
  fl_chart: ^1.0.0

  # Utilities & Localization
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

